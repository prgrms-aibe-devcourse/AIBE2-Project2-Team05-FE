spring:
  datasource:
    url: jdbc:mysql://localhost:3306/travel_mate_db
    username: root
    # 여기에 실제 MySQL 비밀번호를 입력해주세요.
    password: your_actual_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # MySQL 8 버전에 맞는 Dialect를 명시적으로 설정합니다.
        dialect: org.hibernate.dialect.MySQLDialect

